[project]
name = "spec-agent"
version = "0.1.0"
description = "Human-reviewed inspection workflow powered by LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "langsmith>=0.4,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4.2,<5",
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
    "pdfplumber>=0.11.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
spec-agent = "spec_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
